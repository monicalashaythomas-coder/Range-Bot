name: Weekly RangeBot Model Training

on:
  schedule:
    # 07:00 UTC every Monday — report-only, never auto-publishes
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Supabase if it clears the quality bar (150+ trades, sane AUC)?'
        type: boolean
        default: false
      symbol:
        description: 'Filter to one symbol (leave blank for all)'
        type: string
        default: ''
      since:
        description: 'Only trades since this date, e.g. 2026-08-16 (leave blank for all)'
        type: string
        default: ''

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy scikit-learn

      - name: Train (and publish only if explicitly requested)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.symbol }}" ]; then ARGS="$ARGS --symbol ${{ inputs.symbol }}"; fi
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          echo "Running: python3 train_model.py $ARGS"
          python3 train_model.py $ARGS
